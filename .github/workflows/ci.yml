name: CI

on:
  push:
    branches:
      - main
      - feature/**
      - chore/**
      - refactor/**
      - fix/**
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fleetops_test
          POSTGRES_USER: fleetops
          POSTGRES_PASSWORD: fleetops
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fleetops -d fleetops_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=fleetops_test;Username=fleetops;Password=fleetops

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore FleetOps.sln --locked-mode

      - name: Build
        run: dotnet build FleetOps.sln --no-restore --configuration Release

      - name: Install dotnet-ef
        run: dotnet tool restore

      - name: Apply database migrations
        run: dotnet ef database update --project ./src/FleetOps.Infrastructure --startup-project ./src/FleetOps.Api

      - name: Test
        run: dotnet test FleetOps.sln --no-build --configuration Release